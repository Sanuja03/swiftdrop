{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "swiftdrop-db-init",
    "namespace": "swiftdrop",
    "labels": {
      "app.kubernetes.io/name": "swiftdrop-db-init",
      "app.kubernetes.io/part-of": "swiftdrop"
    }
  },
  "spec": {
    "backoffLimit": 2,
    "activeDeadlineSeconds": 900,
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "db-init",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "restartPolicy": "Never",
        "automountServiceAccountToken": false,
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "initContainers": [
          {
            "name": "wait-for-postgres",
            "image": "postgres:17-alpine",
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "sh",
              "-ec",
              "attempt=0; until pg_isready -h \"$PGHOST\" -p \"$PGPORT\" -U \"$PGUSER\" -d \"$PGDATABASE\"; do attempt=$((attempt+1)); [ \"$attempt\" -lt 120 ] || exit 1; sleep 5; done"
            ],
            "env": [
              {
                "name": "PGHOST",
                "value": "postgres"
              },
              {
                "name": "PGPORT",
                "value": "5432"
              },
              {
                "name": "PGDATABASE",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "swiftdrop-config",
                    "key": "POSTGRES_DB"
                  }
                }
              },
              {
                "name": "PGUSER",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "swiftdrop-secrets",
                    "key": "POSTGRES_USER"
                  }
                }
              },
              {
                "name": "PGPASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "swiftdrop-secrets",
                    "key": "POSTGRES_PASSWORD"
                  }
                }
              },
              {
                "name": "PGCONNECT_TIMEOUT",
                "value": "5"
              },
              {
                "name": "EXPECTED_SCHEMA_BUNDLE",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "swiftdrop-db-scripts",
                    "key": "bundle-sha256"
                  }
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "250m",
                "memory": "128Mi"
              }
            }
          }
        ],
        "containers": [
          {
            "name": "apply-schema",
            "image": "postgres:17-alpine",
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "sh",
              "-ec",
              "test -n \"$PGPASSWORD\"; exec psql -X --set=ON_ERROR_STOP=1 --set=expected_bundle=\"$EXPECTED_SCHEMA_BUNDLE\" --file=/db/initialize.sql"
            ],
            "env": [
              {
                "name": "PGHOST",
                "value": "postgres"
              },
              {
                "name": "PGPORT",
                "value": "5432"
              },
              {
                "name": "PGDATABASE",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "swiftdrop-config",
                    "key": "POSTGRES_DB"
                  }
                }
              },
              {
                "name": "PGUSER",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "swiftdrop-secrets",
                    "key": "POSTGRES_USER"
                  }
                }
              },
              {
                "name": "PGPASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "swiftdrop-secrets",
                    "key": "POSTGRES_PASSWORD"
                  }
                }
              },
              {
                "name": "PGCONNECT_TIMEOUT",
                "value": "5"
              },
              {
                "name": "EXPECTED_SCHEMA_BUNDLE",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "swiftdrop-db-scripts",
                    "key": "bundle-sha256"
                  }
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "database-scripts",
                "mountPath": "/db",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "database-scripts",
            "configMap": {
              "name": "swiftdrop-db-scripts",
              "defaultMode": 292
            }
          }
        ]
      }
    }
  }
}
