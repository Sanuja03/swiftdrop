{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "rabbitmq",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "rabbitmq",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "selector": {
          "app.kubernetes.io/name": "rabbitmq",
          "app.kubernetes.io/part-of": "swiftdrop"
        },
        "ports": [
          {
            "name": "amqp",
            "port": 5672,
            "targetPort": "amqp",
            "protocol": "TCP"
          },
          {
            "name": "management",
            "port": 15672,
            "targetPort": "management",
            "protocol": "TCP"
          }
        ],
        "type": "ClusterIP"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "rabbitmq-headless",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "rabbitmq",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "selector": {
          "app.kubernetes.io/name": "rabbitmq",
          "app.kubernetes.io/part-of": "swiftdrop"
        },
        "ports": [
          {
            "name": "amqp",
            "port": 5672,
            "targetPort": "amqp",
            "protocol": "TCP"
          }
        ],
        "clusterIP": "None"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "rabbitmq",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "rabbitmq",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "serviceName": "rabbitmq-headless",
        "replicas": 1,
        "persistentVolumeClaimRetentionPolicy": {
          "whenDeleted": "Retain",
          "whenScaled": "Retain"
        },
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "rabbitmq",
            "app.kubernetes.io/part-of": "swiftdrop"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "rabbitmq",
              "app.kubernetes.io/part-of": "swiftdrop"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 60,
            "securityContext": {
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "rabbitmq",
                "image": "rabbitmq:4.4.0-management",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "name": "amqp",
                    "containerPort": 5672
                  },
                  {
                    "name": "management",
                    "containerPort": 15672
                  }
                ],
                "env": [
                  {
                    "name": "RABBITMQ_DEFAULT_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "RABBITMQ_USERNAME"
                      }
                    }
                  },
                  {
                    "name": "RABBITMQ_DEFAULT_PASS",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "RABBITMQ_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "RABBITMQ_DEFAULT_VHOST",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "swiftdrop-config",
                        "key": "RABBITMQ_VHOST"
                      }
                    }
                  },
                  {
                    "name": "RABBITMQ_NODENAME",
                    "value": "rabbit@rabbitmq-0"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "512Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "startupProbe": {
                  "exec": {
                    "command": [
                      "rabbitmq-diagnostics",
                      "-q",
                      "check_running"
                    ]
                  },
                  "periodSeconds": 5,
                  "timeoutSeconds": 10,
                  "failureThreshold": 60
                },
                "livenessProbe": {
                  "exec": {
                    "command": [
                      "rabbitmq-diagnostics",
                      "-q",
                      "ping"
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 10,
                  "failureThreshold": 6
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                "sh",
                "-ec",
                "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 10,
                  "failureThreshold": 3
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/rabbitmq"
                  }
                ]
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "2Gi"
                }
              }
            }
          }
        ]
      }
    }
  ]
}
