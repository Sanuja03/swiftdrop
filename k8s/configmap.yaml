{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "swiftdrop-config",
    "namespace": "swiftdrop",
    "labels": {
      "app.kubernetes.io/name": "swiftdrop-config",
      "app.kubernetes.io/part-of": "swiftdrop"
    }
  },
  "data": {
    "POSTGRES_DB": "swiftdrop",
    "RABBITMQ_HOST": "rabbitmq",
    "RABBITMQ_PORT": "5672",
    "RABBITMQ_VHOST": "/",
    "CORS_ALLOWED_ORIGINS": "http://localhost:5173",
    "OUTBOX_POLL_INTERVAL_MS": "2000",
    "WEBHOOK_RETRY_DELAYS": "10s,30s,2m,10m,30m",
    "MINIO_ENDPOINT": "",
    "MINIO_PROOF_BUCKET": "delivery-proofs",
    "SPRING_MAIL_HOST": "smtp.gmail.com",
    "SPRING_MAIL_PORT": "587",
    "SPRING_JPA_HIBERNATE_DDL_AUTO": "none",
    "SPRING_SQL_INIT_MODE": "never",
    "SPRING_JPA_SHOW_SQL": "false",
    "MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED": "true",
    "MANAGEMENT_ENDPOINT_HEALTH_GROUP_LIVENESS_INCLUDE": "livenessState",
    "MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE": "readinessState,db,rabbit",
    "MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS": "never",
    "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info",
    "SERVER_SHUTDOWN": "graceful",
    "SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE": "20s",
    "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=20.0",
    "SPRING_PROFILES_ACTIVE": "default",
    "GOOGLE_CLIENT_ID": "",
    "APP_AUTH_GOOGLE_MOCK_TOKENS_ENABLED": "false",
    "SWIFTDROP_WEBHOOKS_DIRECT_DELIVERY_ENABLED": "false",
    "AI_BASE_URL": "https://api.openai.com/v1",
    "AI_MODEL": "gpt-4o-mini",
    "AI_MAX_ITERATIONS": "5",
    "AI_TIMEOUT_SECONDS": "30",
    "DB_REVIEWED_PROOF_CONVERSION": "false"
  }
}
