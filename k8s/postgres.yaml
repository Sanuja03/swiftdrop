{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "postgres",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "postgres",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "selector": {
          "app.kubernetes.io/name": "postgres",
          "app.kubernetes.io/part-of": "swiftdrop"
        },
        "ports": [
          {
            "name": "postgres",
            "port": 5432,
            "targetPort": "postgres",
            "protocol": "TCP"
          }
        ],
        "type": "ClusterIP"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "postgres-headless",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "postgres",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "selector": {
          "app.kubernetes.io/name": "postgres",
          "app.kubernetes.io/part-of": "swiftdrop"
        },
        "ports": [
          {
            "name": "postgres",
            "port": 5432,
            "targetPort": "postgres",
            "protocol": "TCP"
          }
        ],
        "clusterIP": "None"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "postgres",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "postgres",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "serviceName": "postgres-headless",
        "replicas": 1,
        "persistentVolumeClaimRetentionPolicy": {
          "whenDeleted": "Retain",
          "whenScaled": "Retain"
        },
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "postgres",
            "app.kubernetes.io/part-of": "swiftdrop"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "postgres",
              "app.kubernetes.io/part-of": "swiftdrop"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 60,
            "securityContext": {
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "postgres",
                "image": "postgres:17-alpine",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "name": "postgres",
                    "containerPort": 5432
                  }
                ],
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "swiftdrop-config",
                        "key": "POSTGRES_DB"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "POSTGRES_USER"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "POSTGRES_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "PGDATA",
                    "value": "/var/lib/postgresql/data/pgdata"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "256Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "startupProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-ec",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "periodSeconds": 5,
                  "timeoutSeconds": 5,
                  "failureThreshold": 60
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-ec",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3
                },
                "livenessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-ec",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 6
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  }
                ]
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "5Gi"
                }
              }
            }
          }
        ]
      }
    }
  ]
}
