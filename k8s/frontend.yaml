{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "frontend",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "frontend",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "selector": {
          "app.kubernetes.io/name": "frontend",
          "app.kubernetes.io/part-of": "swiftdrop"
        },
        "ports": [
          {
            "name": "http",
            "port": 80,
            "targetPort": "http",
            "protocol": "TCP"
          }
        ],
        "type": "ClusterIP"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "frontend",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "frontend",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "RollingUpdate",
          "rollingUpdate": {
            "maxSurge": 1,
            "maxUnavailable": 0
          }
        },
        "revisionHistoryLimit": 3,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "frontend",
            "app.kubernetes.io/part-of": "swiftdrop"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "frontend",
              "app.kubernetes.io/part-of": "swiftdrop"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "securityContext": {
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "frontend",
                "image": "swiftdrop-frontend:REPLACE_WITH_IMMUTABLE_TAG",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 80
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "128Mi"
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": "http"
                  },
                  "periodSeconds": 5,
                  "timeoutSeconds": 5,
                  "failureThreshold": 30
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": "http"
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 6
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": "http"
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false
                },
                "volumeMounts": [
                  {
                    "name": "nginx-config",
                    "mountPath": "/etc/nginx/conf.d/default.conf",
                    "subPath": "default.conf",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "nginx-config",
                "configMap": {
                  "name": "swiftdrop-frontend-config"
                }
              }
            ]
          }
        }
      }
    }
  ]
}
