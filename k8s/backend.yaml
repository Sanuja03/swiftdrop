{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "backend",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "backend",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "selector": {
          "app.kubernetes.io/name": "backend",
          "app.kubernetes.io/part-of": "swiftdrop"
        },
        "ports": [
          {
            "name": "http",
            "port": 8080,
            "targetPort": "http",
            "protocol": "TCP"
          }
        ],
        "type": "ClusterIP"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "backend",
        "namespace": "swiftdrop",
        "labels": {
          "app.kubernetes.io/name": "backend",
          "app.kubernetes.io/part-of": "swiftdrop"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "progressDeadlineSeconds": 900,
        "revisionHistoryLimit": 3,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "backend",
            "app.kubernetes.io/part-of": "swiftdrop"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "backend",
              "app.kubernetes.io/part-of": "swiftdrop"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 30,
            "securityContext": {
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "initContainers": [
              {
                "name": "wait-for-schema",
                "image": "postgres:17-alpine",
                "imagePullPolicy": "IfNotPresent",
                "command": [
                  "sh",
                  "/db/wait-for-schema.sh"
                ],
                "env": [
                  {
                    "name": "PGHOST",
                    "value": "postgres"
                  },
                  {
                    "name": "PGPORT",
                    "value": "5432"
                  },
                  {
                    "name": "PGDATABASE",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "swiftdrop-config",
                        "key": "POSTGRES_DB"
                      }
                    }
                  },
                  {
                    "name": "PGUSER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "POSTGRES_USER"
                      }
                    }
                  },
                  {
                    "name": "PGPASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "POSTGRES_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "PGCONNECT_TIMEOUT",
                    "value": "5"
                  },
                  {
                    "name": "EXPECTED_SCHEMA_BUNDLE",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "swiftdrop-db-scripts",
                        "key": "bundle-sha256"
                      }
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "database-scripts",
                    "mountPath": "/db",
                    "readOnly": true
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "cpu": "250m",
                    "memory": "128Mi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "runAsUser": 10001,
                  "runAsNonRoot": true
                }
              }
            ],
            "containers": [
              {
                "name": "backend",
                "image": "swiftdrop-backend:REPLACE_WITH_IMMUTABLE_TAG",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "name": "http",
                    "containerPort": 8080
                  }
                ],
                "envFrom": [
                  {
                    "configMapRef": {
                      "name": "swiftdrop-config"
                    }
                  }
                ],
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "swiftdrop-config",
                        "key": "POSTGRES_DB"
                      }
                    }
                  },
                  {
                    "name": "SPRING_DATASOURCE_URL",
                    "value": "jdbc:postgresql://postgres:5432/$(POSTGRES_DB)"
                  },
                  {
                    "name": "SPRING_DATASOURCE_USERNAME",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "POSTGRES_USER"
                      }
                    }
                  },
                  {
                    "name": "SPRING_DATASOURCE_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "POSTGRES_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "JWT_SECRET",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "JWT_SECRET"
                      }
                    }
                  },
                  {
                    "name": "RABBITMQ_USERNAME",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "RABBITMQ_USERNAME"
                      }
                    }
                  },
                  {
                    "name": "RABBITMQ_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "RABBITMQ_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "SPRING_MAIL_USERNAME",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "SPRING_MAIL_USERNAME",
                        "optional": true
                      }
                    }
                  },
                  {
                    "name": "SPRING_MAIL_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "SPRING_MAIL_PASSWORD",
                        "optional": true
                      }
                    }
                  },
                  {
                    "name": "MINIO_ACCESS_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "MINIO_ACCESS_KEY",
                        "optional": true
                      }
                    }
                  },
                  {
                    "name": "MINIO_SECRET_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "MINIO_SECRET_KEY",
                        "optional": true
                      }
                    }
                  },
                  {
                    "name": "AI_API_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "swiftdrop-secrets",
                        "key": "AI_API_KEY",
                        "optional": true
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "512Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/actuator/health/liveness",
                    "port": "http"
                  },
                  "periodSeconds": 5,
                  "timeoutSeconds": 5,
                  "failureThreshold": 60
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/actuator/health/liveness",
                    "port": "http"
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 6
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/actuator/health/readiness",
                    "port": "http"
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "runAsGroup": 10001,
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "database-scripts",
                "configMap": {
                  "name": "swiftdrop-db-scripts",
                  "defaultMode": 292
                }
              }
            ]
          }
        }
      }
    }
  ]
}
