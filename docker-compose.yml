
services:
  postgres:
    image: postgres:17-alpine
    container_name: swiftdrop-postgres
    environment:
      POSTGRES_DB: swiftdrop
      POSTGRES_USER: swiftdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftdrop -d swiftdrop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: swiftdrop-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swiftdrop
      SPRING_DATASOURCE_USERNAME: swiftdrop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop_dev_password}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: swiftdrop-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
