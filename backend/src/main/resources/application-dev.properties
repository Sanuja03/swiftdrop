# Development profile: local H2 in PostgreSQL mode, demo merchant and test parcels seeded
spring.datasource.url=jdbc:h2:file:./data/swiftdrop_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Tables used only through JDBC (no entity, so Hibernate does not create them), after Hibernate's own
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/dev/h2-jdbc-tables.sql

# Demo merchant password (so we can log in directly during manual testing)
DEV_MERCHANT_PASSWORD=MerchantPass123!

# Dev JWT Secret
app.jwt.secret=SwiftDropSuperSecretKeyForDevelopmentAndTestingOnlyAtLeast256BitsLong1234567890
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=604800000

# Mock local mail for dev testing (won't throw connection exceptions)
spring.mail.host=localhost
spring.mail.port=25
management.health.mail.enabled=false
spring.mail.username=notifications@example.test

# RabbitMQ listeners and the outbox publisher are off unless DEV_MESSAGING_ENABLED=true
# (set it when a local broker runs: docker compose up -d rabbitmq, plus RABBITMQ_USERNAME/PASSWORD)
spring.rabbitmq.listener.simple.auto-startup=${DEV_MESSAGING_ENABLED:false}
app.messaging.outbox.publisher-enabled=${DEV_MESSAGING_ENABLED:false}

# CORS for Vite frontend
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
