# Development profile: local H2 in PostgreSQL mode, demo merchant and test parcels seeded
spring.datasource.url=jdbc:h2:file:./data/swiftdrop_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Demo merchant password (so we can log in directly during manual testing)
DEV_MERCHANT_PASSWORD=MerchantPass123!

# Dev JWT Secret
app.jwt.secret=SwiftDropSuperSecretKeyForDevelopmentAndTestingOnlyAtLeast256BitsLong1234567890
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=604800000

# Mock local mail for dev testing (won't throw connection exceptions)
spring.mail.host=localhost
spring.mail.port=25
management.health.mail.enabled=false
spring.mail.username=notifications@example.test

# Disable rabbitmq listener and outbox publisher if no local broker running
spring.rabbitmq.listener.simple.auto-startup=false
app.messaging.outbox.publisher-enabled=false

# CORS for Vite frontend
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
