# SwiftDrop CI/CD pipeline (GitHub Actions)
#
# CI  (every pull request into any branch, and every push to main):
#     1. backend  : compile + run tests (in-memory H2 database from
#                   src/test/resources/application.properties), then save
#                   test results and the JaCoCo coverage report
#     2. frontend : install + lint + regression tests + production build
#     3. api-tests: local mock contracts + Newman smoke against disposable H2
#     4. docker   : build both Docker images (proves the Dockerfiles still work)
# CD  (only when code lands on main):
#     4. docker   : also push the images to GitHub Container Registry (ghcr.io)

name: CI/CD

on:
  pull_request: # a PR into ANY branch (main, develop, a feature branch...)
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

# If you push to a PR again while its run is still going, cancel the old run.
# Runs on main are never cancelled, so an image push is never cut off halfway.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # No database settings here on purpose: the tests use their own in-memory
    # H2 database (src/test/resources/application.properties), so CI never
    # touches Supabase and needs no database service.

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      # Show the coverage numbers on the run's Summary page, so nobody has to
      # download the report just to see the percentage.
      - name: Write coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          {
            echo "## Backend test coverage (JaCoCo)"
            if [ ! -f "$CSV" ]; then
              echo "No coverage report was produced (the build failed before the tests finished)."
            else
              awk -F, '
                function pct(c, m) { return (c + m) == 0 ? "n/a" : sprintf("%.1f%%", 100 * c / (c + m)) }
                NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
                END {
                  print "| Metric | Covered | Total | Coverage |"
                  print "|---|---:|---:|---:|"
                  printf "| Lines | %d | %d | %s |\n", lc, lc + lm, pct(lc, lm)
                  printf "| Branches | %d | %d | %s |\n", bc, bc + bm, pct(bc, bm)
                  printf "| Instructions | %d | %d | %s |\n", ic, ic + im, pct(ic, im)
                }' "$CSV"
              echo ""
              echo "Full report: download **backend-test-and-coverage-reports** below and open \`jacoco/index.html\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Save the test results + JaCoCo coverage report so you can download them
      # from the run page. "always()" means: save them even if tests failed.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 30

      - name: Share backend JAR with isolated API test job
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-test-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend regression tests including merchant webhook settings
        run: npm test

      - name: Build
        run: npm run build

  api-tests:
    name: Webhook receiver and Newman API smoke
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check collection and mandatory contribution contracts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/swiftdrop-api-evidence"
          node postman/validate.mjs | tee "$RUNNER_TEMP/swiftdrop-api-evidence/collection-validation.log"
          node --test mock-merchant/test/receiver.test.mjs postman/ci.test.mjs frontend/src/features/merchant/services/merchantApi.test.mjs | tee "$RUNNER_TEMP/swiftdrop-api-evidence/mandatory-node-tests.log"

      - uses: actions/download-artifact@v4
        with:
          name: backend-api-test-jar
          path: ${{ runner.temp }}/swiftdrop-api-jar

      - name: Install pinned Newman on the CI runner only
        run: npm install --global newman@6.2.1 --no-audit --no-fund

      - name: Start isolated API test process
        shell: bash
        env:
          # Fresh in-process H2, not the configured Supabase database or any Docker volume.
          SPRING_PROFILES_ACTIVE: default
          SPRING_DATASOURCE_URL: "jdbc:h2:mem:swiftdrop_api_ci;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_SQL_INIT_MODE: never
          SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
          APP_MESSAGING_OUTBOX_PUBLISHER_ENABLED: "false"
          SWIFTDROP_WEBHOOKS_DIRECT_DELIVERY_ENABLED: "false"
          APP_AUTH_GOOGLE_MOCK_TOKENS_ENABLED: "false"
          MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
          MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
          MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
          SPRING_MAIL_HOST: 127.0.0.1
          SPRING_MAIL_PORT: "1"
          SERVER_ADDRESS: 127.0.0.1
          SERVER_PORT: "8080"
          AI_API_KEY: ""
          MINIO_ENDPOINT: ""
        run: |
          JWT_SECRET="$(node -p "require('node:crypto').randomBytes(32).toString('base64')")"
          echo "::add-mask::$JWT_SECRET"
          export JWT_SECRET
          mkdir -p "$RUNNER_TEMP/swiftdrop-api-evidence"
          jars=("$RUNNER_TEMP"/swiftdrop-api-jar/*.jar)
          test "${#jars[@]}" -eq 1
          java -Xmx512m -Dapp.messaging.outbox.publisher-enabled=false -jar "${jars[0]}" > "$RUNNER_TEMP/swiftdrop-api-evidence/backend.log" 2>&1 &
          pid=$!
          echo "$pid" > "$RUNNER_TEMP/swiftdrop-api-evidence/backend.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/actuator/health > /dev/null; then
              exit 0
            fi
            kill -0 "$pid" || exit 1
            sleep 2
          done
          echo "Isolated backend did not become healthy within the startup window."
          exit 1

      - name: Run existing collection smoke cases with Newman
        shell: bash
        run: |
          node postman/ci.mjs "$RUNNER_TEMP/swiftdrop-api-evidence/collection.json"
          newman run "$RUNNER_TEMP/swiftdrop-api-evidence/collection.json" \
            --env-var ciIsolatedDatabase=true --bail \
            --timeout-request 10000 --reporters cli,junit \
            --reporter-junit-export "$RUNNER_TEMP/swiftdrop-api-evidence/newman.xml"

      - name: Stop only this job's test process
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/swiftdrop-api-evidence/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/swiftdrop-api-evidence/backend.pid")" 2>/dev/null || true
          fi

      - name: Upload API test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-smoke-results
          path: |
            ${{ runner.temp }}/swiftdrop-api-evidence/newman.xml
            ${{ runner.temp }}/swiftdrop-api-evidence/backend.log
            ${{ runner.temp }}/swiftdrop-api-evidence/collection-validation.log
            ${{ runner.temp }}/swiftdrop-api-evidence/mandatory-node-tests.log
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker images (${{ matrix.service }})
    needs: [backend, frontend, api-tests] # publish/build images only after mandatory checks pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase (Sanuja03 -> sanuja03)
      - name: Prepare image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/swiftdrop-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a pull request: build only (a check).
      # On main: build AND push, tagged "latest" and with the commit id.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
