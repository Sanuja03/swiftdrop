# SwiftDrop CI/CD pipeline (GitHub Actions)
#
# CI  (every pull request into any branch, and every push to main):
#     1. backend  : compile + run tests (in-memory H2 database from
#                   src/test/resources/application.properties), then save
#                   test results and the JaCoCo coverage report
#     2. frontend : install + lint + production build
#     3. docker   : build both Docker images (proves the Dockerfiles still work)
# CD  (only when code lands on main):
#     3. docker   : also push the images to GitHub Container Registry (ghcr.io)

name: CI/CD

on:
  pull_request: # a PR into ANY branch (main, develop, a feature branch...)
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

# If you push to a PR again while its run is still going, cancel the old run.
# Runs on main are never cancelled, so an image push is never cut off halfway.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # No database settings here on purpose: the tests use their own in-memory
    # H2 database (src/test/resources/application.properties), so CI never
    # touches Supabase and needs no database service.

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      # Show the coverage numbers on the run's Summary page, so nobody has to
      # download the report just to see the percentage.
      - name: Write coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          {
            echo "## Backend test coverage (JaCoCo)"
            if [ ! -f "$CSV" ]; then
              echo "No coverage report was produced (the build failed before the tests finished)."
            else
              awk -F, '
                function pct(c, m) { return (c + m) == 0 ? "n/a" : sprintf("%.1f%%", 100 * c / (c + m)) }
                NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
                END {
                  print "| Metric | Covered | Total | Coverage |"
                  print "|---|---:|---:|---:|"
                  printf "| Lines | %d | %d | %s |\n", lc, lc + lm, pct(lc, lm)
                  printf "| Branches | %d | %d | %s |\n", bc, bc + bm, pct(bc, bm)
                  printf "| Instructions | %d | %d | %s |\n", ic, ic + im, pct(ic, im)
                }' "$CSV"
              echo ""
              echo "Full report: download **backend-test-and-coverage-reports** below and open \`jacoco/index.html\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Save the test results + JaCoCo coverage report so you can download them
      # from the run page. "always()" means: save them even if tests failed.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 30

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker images (${{ matrix.service }})
    needs: [backend, frontend] # only runs if both jobs above passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase (Sanuja03 -> sanuja03)
      - name: Prepare image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/swiftdrop-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a pull request: build only (a check).
      # On main: build AND push, tagged "latest" and with the commit id.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
